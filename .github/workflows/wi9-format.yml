name: WI-9 temporary formatting
on:
  push:
    branches: [feat/wi-9-tasks]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/tasks src/features/projects/pages/ProjectDetailsPage.tsx src/features/projects/__tests__/projectDetails.test.tsx src/app/router.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: wi9-formatted
          path: |
            src/features/tasks
            src/features/projects/pages/ProjectDetailsPage.tsx
            src/features/projects/__tests__/projectDetails.test.tsx
            src/app/router.tsx
