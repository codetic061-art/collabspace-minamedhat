name: Gate 2 cloud correction checks
on:
  push:
    branches: [feat/wi-11-integration]
permissions:
  contents: read
jobs:
  cloud-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write docs/wi11-acceptance.md src/features/profile/PasswordCard.tsx src/features/profile/ProfilePage.tsx src/features/tasks/__tests__/taskBoard.test.tsx src/features/tasks/__tests__/tasksPage.test.tsx src/features/tasks/__tests__/taskMutations.integration.test.tsx src/features/projects/__tests__/projectTasks.integration.test.tsx src/features/tasks/components/TaskDetailsModal.tsx src/features/tasks/pages/TaskBoard.tsx src/features/tasks/pages/TasksPage.tsx
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: gate2-formatted
          path: |
            docs/wi11-acceptance.md
            src/features/profile/PasswordCard.tsx
            src/features/profile/ProfilePage.tsx
            src/features/tasks/__tests__/taskBoard.test.tsx
            src/features/tasks/__tests__/tasksPage.test.tsx
            src/features/tasks/__tests__/taskMutations.integration.test.tsx
            src/features/projects/__tests__/projectTasks.integration.test.tsx
            src/features/tasks/components/TaskDetailsModal.tsx
            src/features/tasks/pages/TaskBoard.tsx
            src/features/tasks/pages/TasksPage.tsx
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit and integration tests
        run: npm test -- --run
        continue-on-error: true
      - name: Build and budget
        run: npm run build && npm run check:budget
        continue-on-error: true
