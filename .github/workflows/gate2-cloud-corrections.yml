name: Gate 2 cloud correction checks
on:
  push:
    branches: [feat/wi-11-integration]
permissions:
  contents: read
jobs:
  cloud-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write src/features/tasks/components/TaskDetailsModal.tsx src/features/tasks/hooks/useTaskDetailsMutations.ts src/shared/ui/Input.tsx src/shared/ui/Select.tsx src/shared/ui/Tabs.tsx src/shared/ui/__tests__/interactivePrimitives.test.tsx
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: gate2-formatted
          path: |
            src/features/tasks/components/TaskDetailsModal.tsx
            src/features/tasks/hooks/useTaskDetailsMutations.ts
            src/shared/ui/Input.tsx
            src/shared/ui/Select.tsx
            src/shared/ui/Tabs.tsx
            src/shared/ui/__tests__/interactivePrimitives.test.tsx
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit and integration tests
        run: |
          timeout 90s npm test -- --run > gate2-tests.log 2>&1 || true
          cat gate2-tests.log
        continue-on-error: true
      - name: Build and budget
        run: npm run build && npm run check:budget
        continue-on-error: true
