name: Gate 2 cloud correction checks
on:
  push:
    branches: [feat/wi-11-integration]
permissions:
  contents: read
jobs:
  cloud-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write docs/wi11-acceptance.md
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: gate2-formatted
          path: |
            docs/wi11-acceptance.md
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Unit and integration tests
        run: |
          for test in src/shared/ui/__tests__/interactivePrimitives.test.tsx src/features/profile/__tests__/profile.test.tsx src/features/tasks/__tests__/tasksPage.test.tsx src/features/tasks/__tests__/taskForm.test.tsx; do
            timeout 30s npm test -- "$test" || true
          done
        continue-on-error: true
      - name: Build and budget
        run: npm run build && npm run check:budget
        continue-on-error: true
